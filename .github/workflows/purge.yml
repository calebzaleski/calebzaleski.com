on:
  push:
      branches:
        - main
jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Delay for Coolify Deployment
        run: sleep 45
      - name: Send purge request to cf
        env:
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          curl --fail-with-body -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
