<!DOCTYPE html>
<html lang="en">



<head>
    <meta charset="UTF-8">
    <title>Bible Search | Caleb Zaleski</title>
    <link rel="stylesheet" href="/navbar.css">
    <link rel="stylesheet" href="/bible/style.css?v=3">
    <link rel="icon" type="image/x-icon" href="/images/cz.png">


</head>

<body>
<div class="content">
    <div id="navbar"></div>

    <div class="biblefull">
        <h4>query a word or sentence from the Hebrew definition.</h4>

        <div class="searchmain">
            <label for="bibleDefQuery"></label><input id="bibleDefQuery" type="text" placeholder="example: Joseph">
        <button id="bibleDefSearchBtn">Search</button>
        </div>
        <!-- we could use a search contains (word or string is in the verse), this could be apart of this search
        it could be /search_$(type) and type could be set here
        -->

        <!--have one single prompt for search verse, verses and chapter. -->
        <h4>search for a word, phrase or sentence from the KJV bible.</h4>

        <div class="searchmain">
            <label for="bibleContentQuery"></label><input id="bibleContentQuery" type="text" placeholder="example: Joseph">
            <button id="bibleContentSearchBtn">Search</button>
        </div>
        <div class="searchresult">
        <div id="searchResults"></div>
        </div>

    </div>

</div>

</body>

<script src="/Index.js"></script>
<script src="bible.js"></script>

</html>
