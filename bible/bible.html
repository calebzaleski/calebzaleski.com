<!DOCTYPE html>
<html lang="en">



<head>
    <meta charset="UTF-8">
    <title>Bible Search | Caleb Zaleski</title>
    <link rel="stylesheet" href="/navbar.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/bible/style.css?v=7">
    <link rel="icon" type="image/x-icon" href="/images/cz.png">


</head>

<body>
<div class="content">
    <div id="navbar"></div>

    <div class="biblefull">
        <div class="pageHero">
            <h1 class="pageTitle">Bible Search</h1>
            <p class="pageSubtitle">Search the KJV text or its underlying Hebrew/Greek definitions, then click any verse for the full word-by-word breakdown.</p>
        </div>

        <div class="console">

            <div class="glass-panel biblequiz">
                <div class="quizHead">
                    <h4 class="sectionLabel">Book quiz</h4>
                    <p id="quizBook" class="quizBookLabel"></p>
                </div>
                <div class="quizInputs">
                    <label for="quizAuthor" class="visuallyHidden">Author</label>
                    <input id="quizAuthor" class="bibleInput bibleInputWide" type="text" placeholder="Author">
                    <label for="quizAuthorbtn" class="strictToggle">
                        <input id="quizAuthorbtn" type="checkbox">
                        <span>Check for NT</span>
                    </label>
                    <button id="quizSubmitBtn" class="bibleBtn">Submit</button>
                </div>
                <p id="quizResult" class="quizResult"></p>
            </div>

            <div class="glass-panel lookupPanel">
                <div class="tabBar" role="tablist">
                    <button type="button" id="tabSearchBtn" class="tabBtn active" role="tab" aria-selected="true" aria-controls="tabPanelSearch">Search</button>
                    <button type="button" id="tabGetBtn" class="tabBtn" role="tab" aria-selected="false" aria-controls="tabPanelGet">Get a passage</button>
                </div>

                <div id="tabPanelSearch" class="tabPanel" role="tabpanel">
                    <p id="searchHint" class="sectionHint">Query a word or sentence from the original-language definition.</p>
                    <div class="searchmain">
                        <label for="bibleSearchMode" class="visuallyHidden">Search by</label>
                        <select id="bibleSearchMode" class="bibleSelect">
                            <option value="def">Hebrew/Greek definition</option>
                            <option value="content">KJV text</option>
                        </select>
                        <label for="bibleSearchQuery" class="visuallyHidden">Search query</label>
                        <input id="bibleSearchQuery" class="bibleInput bibleInputWide" type="text" placeholder="example: Spirit">
                        <label for="bibleContentSearchType" class="strictToggle" id="strictToggleWrap" hidden>
                            <input id="bibleContentSearchType" type="checkbox">
                            <span>Strict search</span>
                        </label>
                        <button id="bibleSearchBtn" class="bibleBtn">Search</button>
                    </div>
                </div>

                <div id="tabPanelGet" class="tabPanel" role="tabpanel" hidden>
                    <p id="getHint" class="sectionHint">Look up a single verse.</p>
                    <div class="searchmain">
                        <label for="bibleGetMode" class="visuallyHidden">Get by</label>
                        <select id="bibleGetMode" class="bibleSelect">
                            <option value="verse">Verse</option>
                            <option value="verses">Verses (range)</option>
                            <option value="chapter">Chapter</option>
                        </select>
                        <label for="bibleGetBook" class="visuallyHidden">Book</label>
                        <input id="bibleGetBook" class="bibleInput bibleInputSmall" type="text" placeholder="e.g. John">
                        <label for="bibleGetChapter" class="visuallyHidden">Chapter</label>
                        <input id="bibleGetChapter" class="bibleInput bibleInputTiny" type="number" min="1" placeholder="e.g. 3">
                        <span class="refSep" id="refSepColon" aria-hidden="true">:</span>
                        <label for="bibleGetVerseStart" class="visuallyHidden">Verse</label>
                        <input id="bibleGetVerseStart" class="bibleInput bibleInputTiny" type="number" min="1" placeholder="e.g. 16">
                        <span class="refSep" id="refSepDash" aria-hidden="true">&ndash;</span>
                        <label for="bibleGetVerseEnd" class="visuallyHidden">End verse</label>
                        <input id="bibleGetVerseEnd" class="bibleInput bibleInputTiny" type="number" min="1" placeholder="e.g. 18" hidden>
                        <button id="bibleGetBtn" class="bibleBtn">Get</button>
                    </div>
                </div>
            </div>

        </div>

        <div class="searchresult">
            <div id="searchResults"></div>
            <div id="verseDetail"></div>
        </div>

    </div>

</div>

</body>

<script src="/Index.js"></script>
<script src="/bible/bible.js"></script>

</html>
